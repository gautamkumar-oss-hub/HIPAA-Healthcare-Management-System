spring:
  application:
    name: appointment-service
  datasource:
    url: ${APPOINTMENT_DATABASE_URL}
    username: ${APPOINTMENT_DB_USER}
    password: ${APPOINTMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
healthcare:
  gateway-url: ${HEALTHCARE_GATEWAY_URL:http://api-gateway:8080}
  security:
    jwt-secret: ${JWT_SECRET}
    field-encryption-key: ${FIELD_ENCRYPTION_KEY}
    issuer: healthcare-auth
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
