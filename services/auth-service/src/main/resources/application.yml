spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DATABASE_URL}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
healthcare:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt-secret: ${JWT_SECRET}
    field-encryption-key: ${FIELD_ENCRYPTION_KEY}
    issuer: healthcare-auth
    access-token-minutes: 10
    refresh-token-days: 7
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
