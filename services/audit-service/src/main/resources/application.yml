spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DATABASE_URL}
    username: ${AUDIT_DB_USER}
    password: ${AUDIT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
healthcare:
  security:
    field-encryption-key: ${FIELD_ENCRYPTION_KEY}
    jwt-secret: ${JWT_SECRET}
    issuer: healthcare-auth
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
